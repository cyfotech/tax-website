    <script>
      try {
        const theme = localStorage.getItem('apexledger_theme');
        if (theme === 'dark') {
          document.documentElement.classList.add('dark');
        }
      } catch (e) {}

      // Suppress Vite HMR WebSocket connection errors in sandbox/iframe environment
      window.addEventListener('unhandledrejection', function(event) {
        var reason = event.reason;
        var msg = (reason && (reason.message || reason.stack || String(reason))) || '';
        if (msg.includes('WebSocket') || msg.includes('websocket')) {
          event.preventDefault();
        }
      });
      window.addEventListener('error', function(event) {
        var msg = (event.message || event.error?.message || '') + '';
        if (msg.includes('WebSocket') || msg.includes('websocket')) {
          event.preventDefault();
        }
      });
    </script>

      "@context": "https://schema.org",

      "name": "ApexLedger Advisory",
      "description": "Premier accounting, corporate tax planning, and strategic financial outsourcing for modern businesses and CPA firms.",
